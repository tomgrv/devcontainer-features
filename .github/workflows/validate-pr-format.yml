# @format

name: Validate PR Format

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR title
        uses: tomgrv/actions/check-pr-format@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fix: true

  check-pr-source-branch:
    name: Validate PR source branch
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check PR source branch
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          COMMIT_MESSAGE="${{ github.event.pull_request.title }}"

          if [ "$SOURCE_BRANCH" = "main" ]; then
            IS_HOTFIX=false
            if [[ "$COMMIT_MESSAGE" =~ hotfix ]] || [[ "$COMMIT_MESSAGE" =~ "hotfix:" ]]; then
              IS_HOTFIX=true
            fi

            if [ "$IS_HOTFIX" = false ]; then
              echo "❌ PRs cannot originate from the main branch unless marked as a hotfix"
              echo ""
              echo "**Rule:** Default PR source branch is \`develop\`, not \`main\`"
              echo "- Only create PRs from \`main\` if explicitly requested or marked as \`hotfix/...\`"
              echo "- Update your branch name or create a new PR from \`develop\`"
              exit 1
            fi
          fi
