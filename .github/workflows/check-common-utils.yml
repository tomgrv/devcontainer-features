# @format

name: Check common-utils scripts

on:
  push:
    paths:
      - 'src/common-utils/**'
      - 'test/common-utils/**'
  pull_request:
    paths:
      - 'src/common-utils/**'
      - 'test/common-utils/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run common-utils tests
        run: bats test/common-utils/
