# @format

name: 'Publish Features'
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish-devcontainer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: 'Publish Features'
        uses: devcontainers/action@v1
        with:
          publish-features: 'true'
          base-path-to-features: './src'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-npm-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7

      - name: List unpublished feature packages
        id: list
        uses: tomgrv/actions/list-packages@v2
        with:
          require-repository: 'false'
          filter: '.private == false and (.path | test("(^|/)src/")) and (.registry.npmjs.published | not)'

  publish-npm-packages:
    needs: detect-npm-packages
    if: ${{ needs.detect-npm-packages.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-npm-packages.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Publish ${{ matrix.package.name }}
        uses: tomgrv/actions/publish-npm@v2
        with:
          path: ${{ matrix.package.path }}
