# @format

name: 'Publish Features'
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - package.json
      - .github/workflows/publish-features.yml
  # release-promote pushes with GITHUB_TOKEN, and a push made with that token does not
  # trigger the push workflows. Run once a release has completed instead.
  workflow_run:
    workflows:
      - 'Release Prod'
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish-devcontainer:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: 'Publish Features'
        uses: devcontainers/action@v1
        with:
          publish-features: 'true'
          base-path-to-features: './src'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-npm-packages:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: List unpublished feature packages
        id: list
        uses: tomgrv/actions/list-packages@v3
        with:
          require-repository: 'false'
          filter: '.private == false and (.path | test("(^|/)src/")) and (.registry.npmjs.published | not)'

  publish-npm-packages:
    needs: detect-npm-packages
    if: ${{ needs.detect-npm-packages.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-npm-packages.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Publish ${{ matrix.package.name }}
        uses: tomgrv/actions/publish-npm@v3
        with:
          path: ${{ matrix.package.path }}
