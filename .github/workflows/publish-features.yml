# @format

name: 'Publish dev container features & Generate Documentation'
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: 'Publish Features'
        uses: devcontainers/action@v1
        with:
          publish-features: 'true'
          base-path-to-features: './src'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; the version bundled
      # with actions/setup-node's Node.js LTS may be older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Publish changed feature packages to npm
        run: |
          for dir in src/*/; do
            dir="${dir%/}"
            [ -f "$dir/package.json" ] || continue

            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            private=$(node -p "require('./$dir/package.json').private || false")

            if [ "$private" = "true" ]; then
              echo "Skipping $name (private)"
              continue
            fi

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
              continue
            fi

            echo "Publishing $name@$version"
            npm publish --workspace "$dir" --access public --provenance
          done
