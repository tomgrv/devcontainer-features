# @format

name: 'Release Main'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run through beta/prod without pushing to main (verification only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-main:
    # TODO: pin to a released tag of tomgrv/actions once its
    # multi-repo-consistency PR merges and tags (currently pointing at the
    # working branch so every repo's PR can be reviewed together).
    uses: tomgrv/actions/.github/workflows/release-promote.yml@claude/multi-repo-consistency-release-7se0jy
    with:
      # TODO: pin to a released tag of tomgrv/scripts once that repo's own
      # PR merges and tags.
      scripts_ref: claude/multi-repo-consistency-release-7se0jy
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
