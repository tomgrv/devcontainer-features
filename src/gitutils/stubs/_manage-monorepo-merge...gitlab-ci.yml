# @format

# Counterpart of .github/workflows/manage-monorepo-merge.yml
#
# Pending: degit-package and create-pr push to and open pull requests on the
# GitHub package repositories (GitHub API). The GitHub App token is replaced by
# a GITHUB_TOKEN CI/CD variable that can write to those repositories. The
# package matrix is a loop, and the PHP/Node setup steps are the job image.
# Set SOURCE_BRANCH / EXCLUDE_PATHS (the workflow inputs) when running manually.
manage-monorepo-merge:
  extends: .zz-use
  stage: deploy
  timeout: 30m
  resource_group: manage-monorepo-merge
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  variables:
    SOURCE_BRANCH: ''
    EXCLUDE_PATHS: .github,.devcontainer,.git
  script:
    - zz-use -x tomgrv/actions/list-packages
    - sed -n 's/^packages=//p' "$GITHUB_OUTPUT" | tail -1 | jq -c '.[]' > .packages
    - zz-use -x tomgrv/actions/config-bot
    - |
      out() { sed -n "s/^$1=//p" "$GITHUB_OUTPUT" | tail -1; }
      failed=0
      while read -r pkg; do
        org=$(echo "$pkg" | jq -r .org)
        name=$(echo "$pkg" | jq -r .name)
        : > "$GITHUB_OUTPUT"
        SOURCE_ORG=$org SOURCE_NAME=$name TARGET_SUBDIR=$(echo "$pkg" | jq -r .location) \
          zz-use -x tomgrv/actions/degit-package || { failed=1; continue; }
        [ "$(out has-changes)" = true ] || continue
        branch=$(out source-branch)
        FORGE=github REPOSITORY=$org/$name HEAD_BRANCH=$(out degit-branch) WORKING_DIRECTORY=$(out degit-workdir) \
          COMMIT_MESSAGE="sync: degit from $org/$name@$branch" \
          PR_TITLE="sync: degit from $org/$name" \
          PR_BODY="Automated degit sync from $org/$name. Source branch: $branch. Source commit: $(out source-sha)" \
          zz-use -x tomgrv/actions/create-pr || failed=1
      done < .packages
      exit $failed
