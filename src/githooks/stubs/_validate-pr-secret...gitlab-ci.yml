# @format

# Counterpart of .github/workflows/validate-pr-secret.yml
#
# tomgrv/actions/check-secret wraps gitleaks/gitleaks-action (no run.sh, so it
# cannot run through zz-use): the gitleaks CLI is run directly instead. The CLI
# needs no license, and reports in the job log rather than on the merge request.
validate-pr-secret:
  stage: test
  timeout: 10m
  interruptible: true
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: ['']
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: '0'
  script:
    - gitleaks detect --source . --redact --verbose --log-opts "$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
