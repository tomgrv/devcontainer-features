# @format

# Forgejo has no ready_for_review pull request type: same checks on the usual PR events.
# Skipped on GitHub (including Enterprise Server), where the ready_for_review workflow of the same name runs.

name: Validate PR is not introducing vulnerabilities (Forgejo)

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-vulnerabilities:
    if: ${{ endsWith(github.api_url, '/api/v1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Scan dependencies, IaC and secrets
        # Pinned to a commit: the action's tags are mutable.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

