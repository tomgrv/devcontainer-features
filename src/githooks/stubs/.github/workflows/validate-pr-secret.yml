# @format

name: Validate PR is not leaking secrets

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR secrets
        if: env.GITLEAKS_LICENSE != ''
        uses: tomgrv/actions/check-secret@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gitleaks-license: ${{ env.GITLEAKS_LICENSE }}
