# @format

# Counterpart of .github/workflows/clean-branches.yml
clean-branches:
  extends: .zz-use
  stage: deploy
  timeout: 10m
  resource_group: clean-branches
  # Needs tomgrv/actions#152. Weekly: create the schedule under CI/CD > Schedules
  # (`0 5 * * 1`); it can also be started by hand.
  # GITLAB_TOKEN: CI/CD variable, project access token with the `api` scope
  # (plus `write_repository` where the job pushes).
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  variables:
    REPO: $CI_PROJECT_PATH
  script:
    - zz-use -x tomgrv/actions/clean-branches
