# @format

name: Validate PR on security side

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

env:
  COMPOSER_CACHE_DIR: ~/.composer/cache
  NODE_ENV: test

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Reviewdog
        uses: tomgrv/actions/setup-reviewdog@v3
        with:
          version: v0.20.3

      - name: Set up PHP toolchain
        uses: tomgrv/actions/setup-php@v3

      - name: Set up Node.js
        uses: tomgrv/actions/setup-node@v3
        with:
          node-version: '24'

      - name: Run npm security audit
        uses: tomgrv/actions/check-security-npm@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run composer security audit
        uses: tomgrv/actions/check-security-composer@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
