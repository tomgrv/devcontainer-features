# @format

name: Validate PR on PHP side

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

env:
  COMPOSER_CACHE_DIR: ~/.composer/cache
  NODE_ENV: test

jobs:
  validate-php-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.20.3

      - name: Set up PHP toolchain
        id: setup-php
        uses: tomgrv/actions/setup-php@v4

      - name: Validate composer
        uses: tomgrv/actions/check-laravel@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pint-blade: 'true'

      - name: Run FilaCheck
        if: ${{ hashFiles('app/Filament/**') != '' }}
        uses: tomgrv/actions/run-filacheck@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: app/Filament

  detect-php-parts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parts.outputs.matrix }}
      has-parts: ${{ steps.parts.outputs.has-parts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List affected PHP parts (core, modules, packages)
        id: parts
        uses: tomgrv/actions/list-php-parts@v4

  run-php-tests:
    name: run-php-tests (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    needs:
      - validate-php-code
      - detect-php-parts
    if: ${{ needs.detect-php-parts.outputs.has-parts == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.detect-php-parts.outputs.matrix) }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP toolchain
        id: setup-php
        uses: tomgrv/actions/setup-php@v4

      - name: Set up Node.js
        uses: tomgrv/actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright browsers
        if: ${{ hashFiles('node_modules/playwright/**') != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run Pest/PHPUnit tests
        id: tests
        uses: tomgrv/actions/run-phptests@v4
        with:
          name: phpunit (${{ matrix.part.name }})
          paths: ${{ matrix.part.path }}
