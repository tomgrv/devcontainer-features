# @format

# Counterpart of .github/workflows/fix-php.yml
#
# Needs tomgrv/actions#152 (create-pr on GitLab); GITLAB_TOKEN needs the `api` and
# `write_repository` scopes. `TARGET_PATHS` and `BASE_BRANCH` are the `paths` /
# `base_branch` inputs: set them when running manually.
fix-phpinsights:
  extends: .zz-use-php
  stage: deploy
  resource_group: fix-phpinsights
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  variables:
    TARGET_PATHS: app,config,database,resources,routes,tests,modules,packages
    BASE_BRANCH: develop
  script:
    - zz-use -x tomgrv/actions/config-bot
    - zz-use -x tomgrv/actions/run-phpstan
    - |
      if [ -d app/Filament ]; then
        FILACHECK_PATH=app/Filament zz-use -x tomgrv/actions/run-filacheck
      fi
    - BLADE=true zz-use -x tomgrv/actions/run-pint
    - |
      if ! git diff --quiet; then
        REPOSITORY=$CI_PROJECT_PATH HEAD_BRANCH="chore/phpinsights-fix-$CI_PIPELINE_ID" \
          WORKING_DIRECTORY=$CI_PROJECT_DIR COMMIT_MESSAGE='chore: apply PHP Insights auto-fixes' \
          PR_TITLE='chore: apply PHP Insights auto-fixes' \
          PR_BODY='Automated PHP Insights fixes generated by CI.' \
          zz-use -x tomgrv/actions/create-pr
      fi
