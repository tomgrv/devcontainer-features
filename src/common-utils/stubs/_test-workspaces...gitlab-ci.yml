# @format

# Counterpart of .github/workflows/test-workspaces.yaml
#
# A draft merge request only runs the workspaces its changes impact (see
# ws-impacted); marking it ready and any push to a non-draft merge request run
# every workspace. The workspace matrix is a loop (GitLab has no dynamic
# `parallel:matrix`), and the "Tests green" aggregate job is the pipeline status.
.test-workspaces:
  extends: .zz-use
  stage: test
  interruptible: true
  before_script:
    - !reference [.zz-use, before_script]
    - apt-get update -qq && apt-get install -y -qq bats

test-workspaces:
  extends: .test-workspaces
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: '0'
    REQUIRE_REPOSITORY: 'false'
  script:
    - |
      FILTER=
      if echo "$CI_MERGE_REQUEST_TITLE" | grep -qiE '^(draft:|\[draft\]|\(draft\))'; then
        zz-use ws-impacted
        FILTER=$(ws-impacted -r "$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD")
      fi
      export FILTER
    - zz-use -x tomgrv/actions/list-packages
    - sed -n 's/^packages=//p' "$GITHUB_OUTPUT" | tail -1 | jq -r '.[].path' > .packages
    - |
      failed=0
      while read -r path; do
        WORKSPACE=$path zz-use -x tomgrv/actions/run-workspace-tests || failed=1
      done < .packages
      exit $failed

# Repo-wide tests are not workspace-scoped: skipped on drafts, run on ready.
repo-tests:
  extends: .test-workspaces
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^(Draft:|\[Draft\]|\(Draft\))/i
  script:
    - |
      if ls tests/*.bats > /dev/null 2>&1; then
        bats tests/
      else
        echo "No repo-wide tests under tests/, skipping."
      fi
